<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPAA — Connexion équipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="CSS/styles.css">
<style>
.auth-page{min-height:100vh;display:grid;place-items:center;background:var(--cream);padding:30px 18px;}
.auth-shell{width:min(100%,520px);}
.auth-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;color:var(--pine);font-weight:600;font-size:.9rem;}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:34px;box-shadow:0 18px 45px -35px rgba(42,33,25,.6);}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.auth-brand .logo-word{color:var(--clay);font-family:var(--font-display);font-size:1.5rem;font-weight:700;}
.auth-card h1{margin-bottom:10px;}
.auth-subtitle{color:var(--ink-soft);margin-bottom:22px;}
.auth-notice{padding:12px 14px;border-radius:10px;background:var(--sand);margin-bottom:16px;font-size:.9rem;}
.auth-notice.error{background:#f7dfdc;color:#7c2f2a;}
.auth-field{display:flex;flex-direction:column;gap:7px;margin-top:15px;}
.auth-field label{font-size:.86rem;font-weight:700;}
.auth-field input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:13px;font:inherit;color:var(--ink);}
.auth-submit{width:100%;margin-top:22px;}
.auth-toggle{width:100%;margin-top:12px;background:none;border:0;color:var(--pine);font:inherit;font-weight:700;cursor:pointer;padding:10px;}
.auth-helper{margin:16px 0 0;color:var(--ink-soft);font-size:.82rem;text-align:center;}
.hidden{display:none!important;}
@media(max-width:520px){.auth-card{padding:24px;}}
</style>
</head>
<body class="auth-page">
<main class="auth-shell">
  <a class="auth-back" id="backAdmin" href="admin.html">← Retour à l’administration</a>
  <section class="auth-card">
    <div class="auth-brand">
      <svg class="logo-mark" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="20" r="9" fill="#E1723B"/><circle cx="7" cy="10" r="4.2" fill="#2F5C52"/><circle cx="27" cy="10" r="4.2" fill="#2F5C52"/><circle cx="10.5" cy="3.5" r="3.1" fill="#E1723B"/><circle cx="23.5" cy="3.5" r="3.1" fill="#E1723B"/></svg>
      <span class="logo-word">SPAA</span>
    </div>
    <p class="hero-eyebrow">Espace équipe</p>
    <h1 id="authTitle">Connexion équipe</h1>
    <p id="authSubtitle" class="auth-subtitle"></p>
    <div id="authNotice" class="auth-notice hidden"></div>
    <form id="authForm">
      <div class="auth-field"><label for="authEmail">Adresse e-mail</label><input id="authEmail" type="email" autocomplete="email" required></div>
      <div class="auth-field"><label for="authPassword">Mot de passe</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required></div>
      <button id="authSubmit" class="btn btn-primary auth-submit" type="submit">Se connecter</button>
      <button id="authToggle" class="auth-toggle" type="button">Créer un compte</button>
    </form>
    <p id="authHelper" class="auth-helper"></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/supabase.js"></script>
<script src="JS/connexion.js"></script>
</body>
</html>
