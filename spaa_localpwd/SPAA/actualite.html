<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SPAA — Actualité</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="CSS/styles.css"><style>.article-page{padding:70px 0 90px}.article-wrap{max-width:850px;margin:auto}.article-image{width:100%;max-height:520px;object-fit:cover;border-radius:var(--radius-lg);margin:20px 0 30px}.article-content{font-size:1.03rem;line-height:1.8;color:var(--ink-soft)}.article-content p{margin-bottom:18px}.article-loading{text-align:center;padding:50px}.back-link{display:inline-block;margin-bottom:18px;color:var(--pine);font-weight:700}</style></head><body><header class="site-header"><div class="wrap header-inner"><a class="logo" href="index.html"><svg class="logo-mark" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="20" r="9" fill="#E1723B"/><circle cx="7" cy="10" r="4.2" fill="#2F5C52"/><circle cx="27" cy="10" r="4.2" fill="#2F5C52"/><circle cx="10.5" cy="3.5" r="3.1" fill="#E1723B"/><circle cx="23.5" cy="3.5" r="3.1" fill="#E1723B"/></svg><span class="logo-word">SPAA</span></a><div class="nav-actions"><a href="connexion.html" class="admin-link">Espace équipe</a></div></div></header><main class="article-page"><div class="wrap article-wrap"><div id="article"><div class="article-loading">Chargement…</div></div></div></main><footer class="site-footer"><div class="wrap footer-bottom"><p>© 2026 SPAA — Site vitrine.</p></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="JS/supabase.js"></script><script>const root=document.getElementById('article');function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}function date(v){return new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}).format(new Date(v));}function paragraphs(v){return String(v??'').split(/\n\s*\n/).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('');}(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){root.innerHTML='<div class="article-loading">Actualité introuvable.</div>';return;}const {data,error}=await supabaseClient.from('news').select('*').eq('id',id).eq('published',true).single();if(error||!data){root.innerHTML='<div class="article-loading">Cette actualité n’est pas disponible.</div>';return;}document.title=`SPAA — ${data.title}`;root.innerHTML=`<a class="back-link" href="actualites.html">← Toutes les actualités</a><p class="news-date">${date(data.published_at||data.created_at)}</p><h1>${esc(data.title)}</h1>${data.image_url?`<img class="article-image" src="${esc(data.image_url)}" alt="${esc(data.title)}">`:''}<div class="article-content">${paragraphs(data.content||data.excerpt||'')}</div>`;})();</script>
  <div class="legal-footer-link" style="text-align:center;padding:18px 20px;font-size:.9rem"><a href="mentions-legales.html">Mentions légales</a></div>
</body></html>
